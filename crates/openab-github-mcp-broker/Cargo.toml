[package]
name = "openab-github-mcp-broker"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Request-scoped Human GitHub credential broker for OpenAB MCP"

[dependencies]
anyhow = "1"
axum = { version = "0.8", default-features = false, features = ["http1", "query", "tokio"] }
base64 = "0.22"
jsonwebtoken = "9"
openab-mcp = { path = "../openab-mcp" }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
ring = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = "2"

[dev-dependencies]
tempfile = "3.27.0"
