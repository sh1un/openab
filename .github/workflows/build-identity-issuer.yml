name: Build Identity Issuer

on:
  push:
    tags:
      - "identity-issuer-*"
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag (default: identity-issuer-<12-char commit SHA>)"
        required: false
        type: string

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/openab

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.metadata.outputs.image }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v6

      - name: Resolve immutable image tag
        id: metadata
        env:
          INPUT_IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          if [ -n "$INPUT_IMAGE_TAG" ]; then
            TAG="$INPUT_IMAGE_TAG"
          else
            TAG="identity-issuer-$(git rev-parse --short=12 HEAD)"
          fi

          if ! printf '%s' "$TAG" | grep -Eq '^[a-z0-9][a-z0-9._-]{0,127}$'; then
            echo "invalid OCI image tag: $TAG" >&2
            exit 1
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "image=${IMAGE_NAME}:${TAG}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push linux/amd64 image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.unified
          target: identity-issuer
          platforms: linux/amd64
          push: true
          tags: ${{ steps.metadata.outputs.image }}
          cache-from: type=gha,scope=identity-issuer-linux-amd64
          cache-to: type=gha,scope=identity-issuer-linux-amd64,mode=max

      - name: Publish build summary
        env:
          IMAGE: ${{ steps.metadata.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "### Identity issuer image"
            echo
            echo "\`${IMAGE}\`"
            echo
            echo "Digest: \`${DIGEST}\`"
          } >> "$GITHUB_STEP_SUMMARY"
